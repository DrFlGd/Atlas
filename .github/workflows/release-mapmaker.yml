# Builds Atlas Map Maker for Windows, with its helper (tools/gamefiles, built
# with PyInstaller), and publishes the installer as a GitHub Release tagged
# mapmaker-v<version>. The viewer's own releases (v* tags, release.yml) are
# separate.
#
# Run it by hand from the Actions tab ("Release Map Maker", "Run workflow")
# with a version such as 0.1.0. It must match apps/mapmaker/package.json.

name: Release Map Maker

on:
  workflow_dispatch:
    inputs:
      version:
        description: Map Maker version to release, for example 0.1.0 (the release tag is mapmaker-v<version>)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-mapmaker-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$version\" is not a version like 0.1.0"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=mapmaker-v$version"
            echo "asset=Atlas-Map-Maker-$version-setup.exe"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the app version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app_version="$(node -p "require('./apps/mapmaker/package.json').version")"
          if [ "$app_version" != "$VERSION" ]; then
            echo "::error::apps/mapmaker/package.json says $app_version, not $VERSION"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/gamefiles/requirements*.txt

      # The helper's tests run on made-up game folders only, then the
      # single-file program is built and tried on one of them.
      - name: Test and build the helper
        working-directory: tools/gamefiles
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          pyinstaller --clean --noconfirm atlas-gamefiles.spec
          ls -l dist
          folder="$RUNNER_TEMP/made-up-dsr"
          python tests/fixtures.py dsr "$folder"
          dist/atlas-gamefiles.exe --version
          dist/atlas-gamefiles.exe check "$folder" --out "$RUNNER_TEMP/check" | tee "$RUNNER_TEMP/check.jsonl"
          tail -n 1 "$RUNNER_TEMP/check.jsonl" | grep -q '"event":"done"'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mapmaker/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Lint, type checks and the app's tests run on every pull request
      # (ci.yml). No signing keys are set: the installer is unsigned.
      - name: Build the Map Maker
        run: pnpm --filter @atlas/mapmaker desktop:build

      - name: Start-up test of the app window
        run: pnpm --filter @atlas/mapmaker test:e2e:windows

      - name: Collect the installer and write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          shopt -s nullglob
          installers=(apps/mapmaker/src-tauri/target/release/bundle/nsis/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found ${#installers[@]}: ${installers[*]}"
            exit 1
          fi
          mkdir -p release
          cp "${installers[0]}" "release/$ASSET"
          ls -l release

          commit="$(git rev-parse --short HEAD)"
          # No backticks below: this heredoc expands variables.
          cat > release/notes.md <<EOF
          Atlas Map Maker $VERSION for Windows. It checks the game files on your own PC (Dark Souls Remastered, then Bloodborne) and reports what map data can be read from them, with a top-down preview of each area. This version only checks and reports: it makes no maps yet. It only reads the game folder, never changes or copies anything in it, and makes no network requests.

          ## How to install and test

          1. Under **Assets** below, download **$ASSET**.
          2. Open the downloaded file. The installer is not signed, so Windows shows a blue "Windows protected your PC" box: click **More info**, then **Run anyway**. Accept the licence (GNU GPL, see below) and install.
          3. Start **Atlas Map Maker** from the Start menu.
          4. Click **Choose folder…** and pick your Dark Souls Remastered folder, usually C:\\Program Files (x86)\\Steam\\steamapps\\common\\DARK SOULS REMASTERED (in Steam: right-click the game, **Manage**, **Browse local files**).
          5. Click **Check game files** and wait for the report (a few minutes).
          6. Click **Save report…**, save the .zip file, and send it back.

          ## Licence

          This installer is under the GNU General Public License version 3 or later, because it carries the game file reader built from tools/gamefiles, which uses Soulstruct and soulstruct-havok (GPL-3.0). Its complete source is this repository at the tag $TAG. The rest of the Atlas repository stays under the MIT licence.

          ---

          Built from commit $commit.
          EOF
          cat release/notes.md

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.asset }}
          path: release/${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: replacing its installer and notes."
            gh release upload "$TAG" "release/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/notes.md
          else
            gh release create "$TAG" "release/$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Atlas Map Maker $VERSION" \
              --latest=false \
              --notes-file release/notes.md
          fi
