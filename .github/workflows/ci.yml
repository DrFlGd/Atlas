name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Also generates the demo pack (map image, tiles and locations).
      - run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium

      # The default build: a viewer, with no download interface in its bundle.
      - run: pnpm test:e2e

      # The interface for map image downloads, in a build with them.
      - name: Web build with downloads, and its download tests
        env:
          ATLAS_ENABLE_DOWNLOADS: '1'
        run: |
          pnpm build
          pnpm --filter @atlas/web test:e2e e2e/downloads.spec.ts

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  # Builds the Tauri desktop app without code signing and uploads the bundles.
  # Runs in parallel with the web checks, which do not wait for it.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The package that ships WebKitWebDriver was renamed between Ubuntu releases.
          if apt-get install --simulate webkitgtk-webdriver >/dev/null 2>&1; then
            webdriver=webkitgtk-webdriver
          else
            webdriver=webkit2gtk-driver
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev "$webdriver" xvfb xdotool
          command -v WebKitWebDriver

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Both feature sets: the viewer (default) and a build with map image
      # downloads (the `downloads` feature, ATLAS_ENABLE_DOWNLOADS=1).
      - name: Rust format, lint and unit tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features downloads -- -D warnings
          cargo test --locked
          cargo test --locked --features downloads

      # The default build: a viewer without map image downloads. Also builds
      # the web app and the demo pack. No signing keys are set.
      - run: pnpm desktop:build

      # The download and map page code is not in it: no command, no text.
      - name: The viewer holds no download code
        run: node apps/desktop/scripts/check-binary.js

      - if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      # Window, map, markers, pack protocol byte ranges, the save and open
      # dialogs (driven with xdotool) and links opening in the system browser;
      # and that the viewer offers no download or saving anywhere.
      - name: Smoke test the app window (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @atlas/desktop test:e2e

      # Starts the built app and checks from outside that its window opens,
      # the embedded browser starts its page and it keeps running, and that
      # its binary holds no download code. Saves a picture of the desktop
      # with the screenshots below.
      - name: Start-up test of the app window (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @atlas/desktop test:e2e:windows

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # Downloads map images from a mock tile server on 127.0.0.1 through the
      # app's interface. Rebuilds the binary with downloads, the test pack as
      # the default game and the demo importer, after the viewer's bundles
      # above have been uploaded.
      - name: Download, maps library, import, delete and map page tests (Linux)
        if: runner.os == 'Linux'
        env:
          ATLAS_ENABLE_DOWNLOADS: '1'
        run: |
          pnpm --filter @atlas/desktop e2e:pack
          ATLAS_BUNDLE_PACKS=e2e-remote,demo,test-isles \
            ATLAS_BUNDLE_IMPORTERS=packages/importer-api/demo/demo-importer.js \
            pnpm desktop:build --no-bundle
          node apps/desktop/scripts/check-binary.js
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:download
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:import
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:delete
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:view

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots-${{ runner.os }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Builds the Android app for 64-bit ARM phones: a viewer with the demo pack
  # in its web build, as folder tiles. The APK is unsigned; releases are
  # signed elsewhere. Then checks the APK: no download code, the demo pack
  # only, the app id, name and minimum Android version.
  android:
    name: Android (aarch64, unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: android

      # The runner comes with the Android SDK (ANDROID_HOME) and NDKs.
      - name: Use the runner's Android SDK and NDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          echo "Android NDK: $ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # The Android shell leaves out what Android cannot do (folder dialogs,
      # the import window, moving 0.2.0 images); no warning may be left.
      - name: Rust lint for Android
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked --target aarch64-linux-android -- -D warnings

      # Creates the Android project (src-tauri/gen/android) and builds the
      # web app, the demo pack and the APK. Downloads stay off.
      - name: Build the Android app
        env:
          ATLAS_ENABLE_DOWNLOADS: '0'
        run: pnpm android:build --target aarch64

      - name: Check the APK
        run: |
          shopt -s nullglob
          apks=(apps/desktop/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one release APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          apk="${apks[0]}"
          ls -l "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"
          node apps/desktop/scripts/check-apk.js "$apk" --packs demo
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${build_tools}aapt2" dump badging "$apk" | tee badging.txt
          grep -q "^package: name='dev.atlas.android'" badging.txt
          grep -Eq "^(sdkVersion|minSdkVersion):'29'" badging.txt
          grep -q "^application-label:'Atlas'" badging.txt
          grep -q "^native-code: 'arm64-v8a'" badging.txt
          echo "The APK is dev.atlas.android, \"Atlas\", for Android 10 (API 29) and later on arm64-v8a."

      # The signing of android-release.yml, with a key made for this run
      # only (no secrets here), and the checks again on the signed APK.
      - name: Sign with a throwaway key and check
        run: |
          bash apps/desktop/scripts/sign-apk.sh "$APK" signed.apk
          node apps/desktop/scripts/check-apk.js signed.apk --packs demo

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@v7
        with:
          name: atlas-android-unsigned
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7
