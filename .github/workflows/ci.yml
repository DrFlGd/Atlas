name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Also generates the demo pack (map image, tiles and locations).
      - run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  # Builds the Tauri desktop app without code signing and uploads the bundles.
  # Runs in parallel with the web checks, which do not wait for it.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The package that ships WebKitWebDriver was renamed between Ubuntu releases.
          if apt-get install --simulate webkitgtk-webdriver >/dev/null 2>&1; then
            webdriver=webkitgtk-webdriver
          else
            webdriver=webkit2gtk-driver
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev "$webdriver" xvfb
          command -v WebKitWebDriver

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Rust format, lint and unit tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # Also builds the web app and the demo pack. No signing keys are set.
      - run: pnpm desktop:build

      - name: Smoke test the app window (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload smoke test screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-screenshot
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
