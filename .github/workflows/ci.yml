name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Also generates the demo pack (map image, tiles and locations).
      - run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
