name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Also generates the demo pack (map image, tiles and locations).
      - run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  # Builds the Tauri desktop app without code signing and uploads the bundles.
  # Runs in parallel with the web checks, which do not wait for it.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The package that ships WebKitWebDriver was renamed between Ubuntu releases.
          if apt-get install --simulate webkitgtk-webdriver >/dev/null 2>&1; then
            webdriver=webkitgtk-webdriver
          else
            webdriver=webkit2gtk-driver
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev "$webdriver" xvfb xdotool
          command -v WebKitWebDriver

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Rust format, lint and unit tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      # Also builds the web app and the demo pack. No signing keys are set.
      - run: pnpm desktop:build

      - run: cargo install tauri-driver --locked

      # Window, map, markers, pack protocol byte ranges, the save and open
      # dialogs (driven with xdotool) and links opening in the system browser.
      - name: Smoke test the app window (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @atlas/desktop test:e2e

      # Window, map, markers and byte ranges on http://atlas-pack.localhost/,
      # through the Edge WebDriver that the runner image ships. That driver
      # follows the installed Edge, which may run ahead of or behind the
      # WebView2 runtime, so a mismatch fails this step without failing the job.
      - name: Smoke test the app window (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          if [ -n "${EDGEWEBDRIVER:-}" ]; then
            export TAURI_NATIVE_DRIVER="$EDGEWEBDRIVER\\msedgedriver.exe"
          fi
          pnpm --filter @atlas/desktop test:e2e

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # Downloads map images from a mock tile server on 127.0.0.1 through the
      # app's interface. Rebuilds the binary with the test pack as the default
      # game, after the bundles above have been uploaded.
      - name: Download test (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @atlas/desktop e2e:pack
          ATLAS_BUNDLE_PACKS=e2e-remote,demo pnpm desktop:build --no-bundle
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:download

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots-${{ runner.os }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7
