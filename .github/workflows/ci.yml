name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Also generates the demo pack (map image, tiles and locations).
      - run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium

      # The default build: a viewer, with no download interface in its bundle.
      - run: pnpm test:e2e

      # The interface for map image downloads, in a build with them.
      - name: Web build with downloads, and its download tests
        env:
          ATLAS_ENABLE_DOWNLOADS: '1'
        run: |
          pnpm build
          pnpm --filter @atlas/web test:e2e e2e/downloads.spec.ts

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  # Builds the Tauri desktop app without code signing and uploads the bundles.
  # Runs in parallel with the web checks, which do not wait for it.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The package that ships WebKitWebDriver was renamed between Ubuntu releases.
          if apt-get install --simulate webkitgtk-webdriver >/dev/null 2>&1; then
            webdriver=webkitgtk-webdriver
          else
            webdriver=webkit2gtk-driver
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev "$webdriver" xvfb xdotool
          command -v WebKitWebDriver

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Both feature sets: the viewer (default) and a build with map image
      # downloads (the `downloads` feature, ATLAS_ENABLE_DOWNLOADS=1).
      - name: Rust format, lint and unit tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --all-targets --locked --features downloads -- -D warnings
          cargo test --locked
          cargo test --locked --features downloads

      # The default build: a viewer without map image downloads. Also builds
      # the web app and the demo pack. No signing keys are set.
      - run: pnpm desktop:build

      # The download and map page code is not in it: no command, no text.
      - name: The viewer holds no download code
        run: node apps/desktop/scripts/check-binary.js

      - if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked

      # Window, map, markers, pack protocol byte ranges, the save and open
      # dialogs (driven with xdotool) and links opening in the system browser;
      # and that the viewer offers no download or saving anywhere.
      - name: Smoke test the app window (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @atlas/desktop test:e2e

      # Starts the built app and checks from outside that its window opens,
      # the embedded browser starts its page and it keeps running, and that
      # its binary holds no download code. Saves a picture of the desktop
      # with the screenshots below.
      - name: Start-up test of the app window (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @atlas/desktop test:e2e:windows

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # Downloads map images from a mock tile server on 127.0.0.1 through the
      # app's interface. Rebuilds the binary with downloads, the test pack as
      # the default game and the demo importer, after the viewer's bundles
      # above have been uploaded.
      - name: Download, maps library, import, delete and map page tests (Linux)
        if: runner.os == 'Linux'
        env:
          ATLAS_ENABLE_DOWNLOADS: '1'
        run: |
          pnpm --filter @atlas/desktop e2e:pack
          ATLAS_BUNDLE_PACKS=e2e-remote,demo,test-isles \
            ATLAS_BUNDLE_IMPORTERS=packages/importer-api/demo/demo-importer.js \
            pnpm desktop:build --no-bundle
          node apps/desktop/scripts/check-binary.js
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:download
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:import
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:delete
          xvfb-run -a pnpm --filter @atlas/desktop test:e2e:view

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-desktop-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots-${{ runner.os }}
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The Map Maker's game file reader (tools/gamefiles, GPL-3.0): its tests,
  # on made-up game folders only.
  gamefiles:
    name: Game file reader tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: tools/gamefiles
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/gamefiles/requirements*.txt

      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # Builds Atlas Map Maker with its helper and tries it on a made-up Dark
  # Souls Remastered folder: on Windows the unsigned installer (uploaded) and
  # a start-up test, on Linux a full check through the app's window.
  mapmaker:
    name: Map Maker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/gamefiles/requirements*.txt

      - name: Build the helper
        working-directory: tools/gamefiles
        run: |
          python -m pip install -r requirements-dev.txt
          pyinstaller --clean --noconfirm atlas-gamefiles.spec
          ls -l dist

      # The single-file helper must run on its own: check a made-up game
      # folder and end with a "done" line and a report.
      - name: Try the helper on a made-up game folder
        working-directory: tools/gamefiles
        run: |
          folder="$RUNNER_TEMP/made-up-dsr"
          python tests/fixtures.py dsr "$folder"
          helper=dist/atlas-gamefiles
          if [ "$RUNNER_OS" = Windows ]; then helper=dist/atlas-gamefiles.exe; fi
          "$helper" --version
          "$helper" check "$folder" --out "$RUNNER_TEMP/check" | tee "$RUNNER_TEMP/check.jsonl"
          tail -n 1 "$RUNNER_TEMP/check.jsonl" | grep -q '"event":"done"'
          test -s "$RUNNER_TEMP/check/report.json"
          test -s "$RUNNER_TEMP/check/atlas-check-report.zip"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The package that ships WebKitWebDriver was renamed between Ubuntu releases.
          if apt-get install --simulate webkitgtk-webdriver >/dev/null 2>&1; then
            webdriver=webkitgtk-webdriver
          else
            webdriver=webkit2gtk-driver
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev "$webdriver" xvfb
          command -v WebKitWebDriver

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mapmaker/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Rust format, lint and unit tests
        working-directory: apps/mapmaker/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build the Map Maker (Windows installer)
        if: runner.os == 'Windows'
        run: pnpm --filter @atlas/mapmaker desktop:build

      - name: Build the Map Maker (Linux, no bundle)
        if: runner.os == 'Linux'
        run: pnpm --filter @atlas/mapmaker desktop:build --no-bundle

      - name: Start-up test (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @atlas/mapmaker test:e2e:windows

      - name: Check a made-up folder through the window (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          xvfb-run -a node apps/mapmaker/e2e/linux.js "$RUNNER_TEMP/made-up-dsr"

      - name: Upload the Map Maker installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: atlas-mapmaker-windows
          path: apps/mapmaker/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Map Maker test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mapmaker-screenshots-${{ runner.os }}
          path: apps/mapmaker/test-results/
          if-no-files-found: ignore
          retention-days: 7
