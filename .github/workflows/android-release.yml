# Builds the Atlas Android app (a viewer with the demo world, no importers
# and no map image downloads) for 64-bit ARM phones, signs it, checks it,
# and attaches it to the release android-v<version> of this repository: a
# draft by default, which only people with write access to the repository
# can see.
#
# Run it from the Actions tab ("Android release", "Run workflow") with the
# version in apps/desktop/package.json. Its tags start with "android-v",
# which release.yml (tags "v*") does not take.
#
# Signing: with the repository secrets ANDROID_KEY_BASE64 (the keystore,
# base64), ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (of the keystore and
# the key) the APK is signed with that key, so each release installs over
# the last. Without them it is signed with a key made for this run only, and
# the release notes say to uninstall the old app first. No key is ever
# committed to this repository.

name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.3.4 (the tag is android-v<version>); must match apps/desktop/package.json
        required: true
        type: string
      draft:
        description: Keep the release a draft (only people with write access see it)
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$version\" is not a version like 0.3.4"
            exit 1
          fi
          app_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$app_version" ]; then
            echo "::error::The app is version $app_version (apps/desktop/package.json), not $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=android-v$version"
            echo "asset=Atlas-$version-android.apk"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: android

      # The runner comes with the Android SDK (ANDROID_HOME) and NDKs.
      - name: Use the runner's Android SDK and NDK
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          echo "Android SDK: $ANDROID_HOME, build tools: $build_tools"
          echo "Android NDK: $ANDROID_NDK_LATEST_HOME"
          {
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME"
            echo "BUILD_TOOLS=$build_tools"
          } >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      # The demo pack only; no importers, no downloads.
      - name: Build the Android app
        env:
          ATLAS_BUNDLE_PACKS: demo
          ATLAS_BUNDLE_IMPORTERS: ''
          ATLAS_ENABLE_DOWNLOADS: '0'
        run: pnpm android:build --target aarch64

      - name: Sign the APK
        id: sign
        env:
          ASSET: ${{ steps.version.outputs.asset }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          apks=(apps/desktop/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one release APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          mkdir -p release
          bash apps/desktop/scripts/sign-apk.sh "${apks[0]}" "release/$ASSET"
          ls -l release

      - name: Check the signed APK
        env:
          ASSET: ${{ steps.version.outputs.asset }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="release/$ASSET"

          # The app: id, name, version, Android 10 and later, 64-bit ARM.
          "${BUILD_TOOLS}aapt2" dump badging "$apk" | tee badging.txt
          grep -q "^package: name='dev.atlas.android'.* versionName='$VERSION'" badging.txt
          grep -Eq "^(sdkVersion|minSdkVersion):'29'" badging.txt
          grep -q "^application-label:'Atlas'" badging.txt
          grep -q "^native-code: 'arm64-v8a'" badging.txt

          # The native library holds no download code.
          mkdir -p check
          unzip -p "$apk" lib/arm64-v8a/libatlas_desktop_lib.so > check/libatlas_desktop_lib.so
          ATLAS_ENABLE_DOWNLOADS=0 node apps/desktop/scripts/check-binary.js check/libatlas_desktop_lib.so

          # The demo pack only and no importers, in the APK and its web build.
          node apps/desktop/scripts/check-apk.js "$apk" --packs demo

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
          KEY: ${{ steps.sign.outputs.key }}
          CERTIFICATE: ${{ steps.sign.outputs.certificate }}
        run: |
          commit="$(git rev-parse --short HEAD)"
          if [ "$KEY" = throwaway ]; then
            signing="This APK is signed with a key made for this build only. **If Atlas for Android is already on the phone, uninstall it first** (this deletes its found marks): Android does not install an app over one signed with another key."
          else
            signing="Every release is signed with the same key, so this one installs over an earlier one and keeps your found marks. Uninstalling the app deletes them."
          fi
          # No backticks below: this heredoc expands variables.
          cat > release/notes.md <<EOF
          Atlas $VERSION for Android phones: the Atlas map viewer. It comes with the made-up demo world only. Add your own games by importing map pack files (.atlaspack) exported from Atlas on a computer. A prototype.

          It needs Android 10 or later on a 64-bit phone.

          ## How to install

          1. On the phone, open this release page in Chrome. While the release is a draft, sign in to github.com first with an account that can see it.
          2. Under **Assets**, tap **$ASSET**. If Chrome warns that the file might be harmful, tap **Download anyway**.
          3. When the download finishes, tap **Open**. The first time, Android asks whether Chrome may install apps: tap **Settings**, turn on **Allow from this source** (the setting is called "Install unknown apps"), then go back.
          4. Tap **Install**. If Google Play Protect warns about an unknown app, tap **More details**, then **Install anyway**.
          5. Open **Atlas** from the app drawer.

          ## Updating

          $signing

          ## What works in this version

          - A layout made for touch screens. On a phone the map fills the screen, with Map, Lists, Progress and Games at the bottom (and Guides for a game with pages); on a tablet, or a phone on its side, a side panel stands beside the map.
          - Tap a marker for the location: **Mark found**, the next location (the next entry of the open list, or the nearest), and, pulled up, its photo, guide and lists. Press and hold a marker to mark it found at once. **Undo** on the notice takes a change back.
          - Search locations, lists and guides, nearest to the middle of the map first, and tick locations off from the results. Filters, a chip per type to show that type alone, and **Nearest unfound**.
          - Lists and guides under **Lists**; figures for the game, each map, region and type under **Progress**.
          - **Games**, then **Import map pack file…**: pick an .atlaspack file from the phone or a cloud drive. Games lists the games on the phone, with their detail and size, and deletes them. The theme and **Keep the screen on** are there too.
          - The Back button closes what is open (a dialog, the location, search, the filters) before it leaves the app.
          - Exporting and importing progress files from the profile under **Progress**. Found marks are saved on the phone.
          - The app stays clear of the status bar and the navigation buttons.

          ## New in 0.9.0

          - **Add to build.** Collect what you want for a build while you read. A guide page has **Add to build** at its head, a table row that names something has a small + button at the end of its first cell, each result of a search in Guides has one, and so does a location's card. The first time, Atlas asks which Build guide to add to, or starts a new one; after that, everything goes to the same list with one press, until you choose **Change**. A notice says what was added, with **Undo**, and a thing that is in the list already is not added twice. Each thing is a step: its name, a link to its page, and the location when you added it from a card. Adding works on a phone.
          - **Find on the map.** A Build guide has **Find on the map**, for the steps that have no location yet. Atlas looks in the links of their pages to the map, at the location names that fit the step's name, and in the page itself (a "Where to find" part, a Location column, a box of facts). It then shows what it found in three groups: found, several possible (nearest first, each with its type and region and a **Show** button for the map), and not found. Nothing changes until you press **Put on the steps**, and that can be undone. Only saved pages are read; nothing is fetched.
          - **Suggest an order** puts a Build guide's steps nearest next and draws the route on the map. It goes by straight lines, so it knows nothing of locked doors, story order, merchants or random drops.

          Find on the map and Suggest an order need a wider screen: a tablet on its side. A list made this way is an ordinary list of your own, and opens in older versions of Atlas. Materials are not counted: add what you need as steps.

          ## New in 0.8.0

          - **One title for several sources.** When you have the same game from more than one place, such as two maps of it from different sources and a wiki, you can show them under one title. On a game in **Games**, choose **Show with another game under one title**, pick the other game and keep the title or type another. The title is one row that says **Sources: A, B**, and opening it opens the source you used last. The maps menu lists the maps of every source under its name, so you change source where you change map. A wiki under the title shows its pages in **Guides** with every source, and **Search wiki** on a location's card searches them.
          - **Nothing is merged.** Each source keeps its own found marks, lists, locations, notes and progress. **Show separately again** undoes the title, and **Take out** removes one source from it; nothing is lost either way.

          A map pack file carries the title when you tick **Include my lists, locations, types and photos**; such a file needs Atlas 0.8.0 to open.

          ## New in 0.7.0

          - **My notes.** Every location's card has **Add a note**, on the locations that came with the game as well as your own. Write what you want to remember in plain text or Markdown, with photos. A location with a note has a small mark on the map, **With my notes** in the filters shows only those, and search finds the words of your notes after the names. Your notes are kept on the phone apart from the game, so updating the game never changes them. If an update takes a location away, its note is kept under **Notes without a location**, where you can copy or delete it. Notes travel in a map pack file when you tick **Include my lists, locations, types and photos**.
          - **Search wiki.** A location's card can search the game's saved wiki pages for the location's name, the best first. Spelling, the order of the words, punctuation, plurals, a number at the end and words written together or apart do not have to match, and other names of a page count too. **Read** opens a page, and **This is the page** links it, for every location of that name or only this one. From then on the card shows the page under **From the wiki**. **Not this page** takes the link off, and **Search for another page** looks again. Only saved pages are searched; nothing is fetched.

          A map pack file that carries notes, or a page linked to one location alone, needs Atlas 0.7.0 to open. An older Atlas uses links made in 0.7.0 without changing them.

          ## New in 0.6.3

          - **Pages under pages.** In Guides, a page that the game's contents does not place is now shown under the page that leads to it, by the fewest links from the contents, instead of in one long list under **Pages**. The contents at the side is a tree: it opens to the page you are reading and shows the pages beside it. **Pages** keeps only the pages that nothing in the contents leads to.
          - **The whole way to a page.** The line above a page names every step down to it, such as Contents › Equipment › Armor › Warden Plate, and each step is a link, so you can go up as well as down.
          - **Also linked from.** A page that several pages link to has one home in the contents. The other pages that link to it are listed on it under **Also linked from**.
          - **Put a page under a page.** When you edit the contents, **Move to…** can put a page under another page as well as in a section. A page you put somewhere stays there.
          - **A page with two names.** A link that uses another name of a page now opens the page.

          The tree is worked out from the links between a game's pages, so it needs a map pack written by Atlas 0.6.3 or later; an older pack shows its pages as before.

          ## New in 0.6.2

          - **Sort a table.** In Guides, press a column heading of a table to sort by it: once for smallest first, again for largest first, a third time for the page's own order. Numbers sort as numbers. It changes only what you see, never the page.
          - **Raised and lowered text.** A guide page can hold raised and lowered text, such as a note's mark or a small tag after a name. In Markdown: ^raised^ and \~lowered\~.
          - **Coloured words.** A guide page can hold coloured words, shown lighter or darker where needed so they can be read in both the light and the dark theme. In Markdown: [words]{color=#b8714a}.
          - **Line breaks in table cells.** A table cell can hold several lines. In the page editor, Shift+Enter in a cell starts a new line; in Markdown it is written &lt;br&gt;.
          - **Hidden tables and lists.** Hidden text can now hold a whole table or list, shown with **Show hidden text**.
          - The page editor keeps all of these when you edit a page.

          A map pack whose guide pages use the new marks needs Atlas 0.6.2 or later; an older app shows the marks as they are written.

          ## New in 0.6.1

          - **A caption no longer stretches a picture.** In Guides, a picture with a long line of words under it was stretched to the width of that line; it keeps its own size now.
          - **Links to pages not there yet.** On a guide page of a game read from a site, a link to a page the game does not hold yet has a dotted underline and says "This page has not been read yet". It becomes a working link when the game gets that page.

          ## New in 0.6.0

          - **Edit guide pages.** **Edit the page** in **Guides** opens a page editor: edit a page as it looks or as Markdown, add pages of your own, hide pages and arrange the contents. The game's own pages are never changed, and your version can be undone. Not tried on a phone yet.
          - **Small pictures in the line of text.** A picture a page gives a small size (an icon or a badge) now stands in the line of text at that size, with no caption.
          - **Map pack files with your pages.** A map pack file exported from Atlas 0.6.0 on a computer can carry the pages you changed or wrote. Such a file needs this version or later.

          ## New since 0.4.4

          - **Guides**: guides read as pages, with a contents, tables, pictures, links between pages and search. A game can hold guides and no map.
          - **Photos** on locations and list entries, and Photo guides shown as cards. A photo marked as a spoiler stays blurred until tapped.
          - **Your own content from a computer.** A map pack file exported with **Include my lists, locations, types and photos** brings your own lists, locations, types and photos to the phone. On a tablet's width, lists can be made and locations edited on the device too; on a phone they are used, not changed.
          - Guide pages linked to the map on a computer show on their locations' cards.
          - The menus now say **location** and **type**.

          Not in this version: making a game from a picture, adding maps from web pages, downloading map images, and reading game saves.

          ---

          Built from Atlas $commit. Signing certificate SHA-256: $CERTIFICATE ($KEY key).
          EOF
          cat release/notes.md

      # --latest=false keeps the desktop release as the repository's latest.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: replacing its APK and notes."
            gh release upload "$TAG" "release/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/notes.md --draft="$DRAFT"
          else
            gh release create "$TAG" "release/$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Atlas for Android $VERSION" \
              --notes-file release/notes.md \
              --draft="$DRAFT" \
              --latest=false
          fi
