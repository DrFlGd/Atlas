# Builds the Atlas viewer for Linux on 64-bit PCs, as an AppImage (one file
# that runs without installing, as SteamOS needs: its system cannot be
# changed, so no deb, rpm or Flatpak here), with the demo world, no
# importers and no map image downloads. It checks the AppImage and starts
# it once (linux-appimage.yml, which release.yml uses too), then attaches
# it to the release linux-trial-<trial> of this repository: a draft
# prerelease by default, which only people with write access to the
# repository can see. Its notes say how to install it on a Steam Deck and
# what to try (trial T3: switching between a game and Atlas in Game Mode).
#
# Run it from the Actions tab ("Linux release", "Run workflow") with the
# trial's number. It builds the branch or tag it is run from. Its tags start
# with "linux-trial-", which release.yml (tags "v*") does not take.
#
# The AppImage is signed for updates when the repository secret
# TAURI_SIGNING_PRIVATE_KEY is set, and built all the same when it is not.
# A trial never publishes latest.json: Atlas updates only from the
# viewer's releases (release.yml).

name: Linux release

on:
  workflow_dispatch:
    inputs:
      trial:
        description: Number of the trial, for example 1 (the tag is linux-trial-<number>)
        required: true
        type: number
      draft:
        description: Keep the release a draft (only people with write access see it)
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: linux-release-${{ inputs.trial }}
  cancel-in-progress: false

jobs:
  trial:
    name: Work out the trial
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trial: ${{ steps.trial.outputs.trial }}
      tag: ${{ steps.trial.outputs.tag }}
    steps:
      - name: Work out the trial
        id: trial
        env:
          INPUT_TRIAL: ${{ inputs.trial }}
        run: |
          trial="$INPUT_TRIAL"
          if ! printf '%s' "$trial" | grep -Eq '^[1-9][0-9]{0,3}$'; then
            echo "::error::\"$trial\" is not a trial number such as 1"
            exit 1
          fi
          {
            echo "trial=$trial"
            echo "tag=linux-trial-$trial"
          } >> "$GITHUB_OUTPUT"

  appimage:
    name: Build
    needs: trial
    uses: ./.github/workflows/linux-appimage.yml
    permissions:
      contents: read
    secrets: inherit

  publish:
    name: Publish the trial
    needs: [trial, appimage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Reading this run's artifact.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Atlas.AppImage --dir release
          ls -l release

      # The notes are written as they are (a quoted heredoc: nothing in it is
      # expanded, and it holds no backticks), then the trial's number and
      # the commit are put in.
      - name: Write the release notes
        env:
          TRIAL: ${{ needs.trial.outputs.trial }}
        run: |
          commit="$(git rev-parse --short HEAD)"
          cat > release/notes.md <<'EOF'
          Atlas for Steam Deck, trial @TRIAL@: a test build of the Atlas map viewer for Linux, made to try Atlas beside a game on a Steam Deck. It comes with the made-up demo world only. It is not a finished release.

          ## What this trial is for

          In Game Mode only one app shows at a time, an app cannot bring itself to the front, and keyboard shortcuts do not reach Atlas. This trial finds out whether you can switch from a game to Atlas and back, and which of two ways of starting Atlas feels right:

          - **Way 1.** Atlas starts together with a game, as a second window of that game. You reach it with the Steam button.
          - **Way 2.** Atlas is its own entry in your Steam library. You start it yourself, then switch between it and the game with the Steam button.

          ## How to install, in Desktop Mode

          1. Press the Steam button, choose **Power**, then **Switch to Desktop**.
          2. Open this release page in the web browser. While the release is a draft, sign in to github.com first with an account that can see it.
          3. Under **Assets**, press **Atlas.AppImage** to download it. It goes to your Downloads folder.
          4. Open the file manager (Dolphin). In your home folder, make a folder named **Applications** if there is none: right-click an empty spot (in Desktop Mode the left trigger, L2, is the right mouse button, and the right trigger, R2, the left one), choose **Create New**, then **Folder**. Move **Atlas.AppImage** from Downloads into it. If an older Atlas.AppImage is there, replace it.
          5. Right-click **Atlas.AppImage**, choose **Properties**, open the **Permissions** tab, tick **Is executable**, and press **OK**. Without this, the file does not start.
          6. Open **Atlas.AppImage** in the file manager to try it. The Atlas window should open with the demo map. Close it again.
          7. Open Steam on the desktop. In the **Games** menu at the top, choose **Add a Non-Steam Game to My Library**. Press **Browse**, go to your home folder, then **Applications**, choose **Atlas.AppImage** and press **Open**. If the file is not listed, set the file type at the bottom of that window to all files. Then tick Atlas.AppImage in the list and press **Add Selected Programs**.
          8. Go back to Game Mode with the **Return to Gaming Mode** icon on the desktop.

          Atlas keeps its files in the same folders as on any Linux computer. The packs folder is .local/share/atlas/packs in your home folder: a pack file (.atlaspack) you put there shows in Atlas. The maps folder is .local/share/atlas/maps, and the settings are in .local/share/atlas/settings.json. The folder .local is hidden: in the file manager, press Ctrl+H to show it.

          ## Trial, way 2: Atlas as its own entry in Steam

          1. In Game Mode, open your **Library**, go to **Non-Steam**, and start **Atlas**.
          2. Press the Steam button and start a game from your library, as you always do.
          3. To switch to Atlas, press the Steam button and choose **Atlas** in the list of apps that are running.
          4. Switch back to the game the same way.
          5. To close Atlas, switch to it, press the Steam button and choose **Exit Game**.

          ## Trial, way 1: Atlas starts with a game

          This is a trial. Later, another app will write this for you; for now you put it in yourself, for one game.

          1. Close Atlas first if it is running from way 2.
          2. In Desktop Mode, open Steam, right-click a game in your library, and choose **Properties**. Under **General**, find **Launch Options**. Use a game whose launch options are empty; if a game has text there, write it down first so you can put it back.
          3. Copy this whole line from this page and paste it into **Launch Options**:

                  bash -c '"$HOME/Applications/Atlas.AppImage" --background & exec "$@"' -- %command%

             It starts Atlas from your Applications folder, without bringing it in front, and then starts the game as before, so that Steam counts Atlas as part of the game.

             The same line is in Atlas too: open **Settings** in Atlas and find **Start Atlas with a game in Steam**. There the line already names the file Atlas runs from, wherever you keep it, and **Copy** puts it on the clipboard, so you can paste it into Launch Options without typing it.
          4. Go back to Game Mode and start that game. Atlas starts at the same time. The game should come up in front of it.
          5. Press the Steam button. Steam may list the game's windows there: choose Atlas to switch to it, and the game's own window to switch back.
          6. When you quit the game, Atlas may stay open as part of the game. If it does, press the Steam button and choose **Exit Game**, which closes both.
          7. When you are done, delete the line from the game's launch options.

          ## Moving around Atlas

          - The touch screen works as it does on a tablet: Atlas starts with large buttons for fingers on a Steam Deck, the sections at the lower left and the buttons used most at the lower right. Press and hold a location to mark it found. If Atlas shows small buttons, touch the screen once, or open **Settings** and set **Controls** to **For fingers**.
          - With the controller, the D-pad or the left stick moves between buttons, A presses, B goes back, and L1 and R1 switch sections or turn the pages of a guide. When the map has the focus, the right stick moves it and the triggers zoom out and in. The first time Atlas sees the controller, a notice says "A controller is connected".
          - If the D-pad, A and B do nothing in Atlas, the web view may not pass the controller on. Then press the Steam button, choose **Controller Settings**, and choose a layout that sends keys, such as the template named **Web Browser**, or set the D-pad to the arrow keys, A to Enter and B to Escape yourself. With keys, the arrow keys move between buttons, Enter presses and Escape goes back. The back grips (L4, L5, R4 and R5) are free if you want to give them keys too.
          - The Steam button and X together open the on-screen keyboard, for search.

          ## If the window is blank or white

          Atlas already sets WEBKIT_DISABLE_DMABUF_RENDERER=1 for its window, which fixes this on most systems. If the window is still blank, open the **Properties** of the Atlas entry in Steam, put this line in **Launch Options**, and start it again:

              WEBKIT_DISABLE_COMPOSITING_MODE=1 %command%

          ## What to tell us

          1. Desktop Mode: does the Atlas window open and show the demo map?
          2. Way 2: does the Atlas window show in Game Mode? Can you switch from the game to Atlas and back with the Steam button?
          3. Way 1: does Atlas start with the game, and does the game still come up in front? Can you switch to Atlas and back? What happens when you quit the game?
          4. Did the notice "A controller is connected" show? Do the D-pad, A, B, L1 and R1 move around Atlas? Did you have to change the controller layout, and to which one?
          5. Which way felt right, and why?
          6. Anything that went wrong. A picture of the screen helps: in Game Mode, press the Steam button and R1 together.

          Not in this build: the icon in the notification area, the hotkey and starting with the system, which are on Windows only. Opening a pack file from the file manager does not start Atlas yet.

          ---

          Built from Atlas @COMMIT@.
          EOF
          sed -i -e "s/@TRIAL@/$TRIAL/g" -e "s/@COMMIT@/$commit/g" release/notes.md
          if grep -q '@[A-Z]*@' release/notes.md; then
            echo "::error::A placeholder is left in the notes"
            exit 1
          fi
          cat release/notes.md

      # A prerelease; --latest=false keeps the viewer's release as the
      # repository's latest. Only the AppImage is attached: a trial never
      # has latest.json, so no Atlas takes it as an update, and no
      # signature either.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.trial.outputs.tag }}
          TRIAL: ${{ needs.trial.outputs.trial }}
          ASSET: Atlas.AppImage
          DRAFT: ${{ inputs.draft }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: replacing its AppImage and notes."
            gh release upload "$TAG" "release/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/notes.md \
              --draft="$DRAFT" --prerelease
          else
            gh release create "$TAG" "release/$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Atlas for Steam Deck, trial $TRIAL" \
              --notes-file release/notes.md \
              --draft="$DRAFT" \
              --prerelease \
              --latest=false
          fi
