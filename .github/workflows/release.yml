# Builds the plain Atlas viewer for Windows (with the demo world, no
# importers and no map image downloads) and publishes the installer as a
# GitHub Release of this repository, the repository's latest. Then it adds
# the Linux AppImage (linux-appimage.yml) and latest.json, which tells every
# Atlas that updates itself about this version (see "Updates" in the
# README).
#
# Run it from the Actions tab ("Release", "Run workflow") with a version such
# as 0.3.0, or push a tag such as v0.3.0. The version must match the one in
# apps/desktop/package.json, so the installer and the app say the same.
#
# Updates are signed: the repository secret TAURI_SIGNING_PRIVATE_KEY (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, empty for a key without one) must be
# set, or the release stops at once. The Windows release does not wait for
# Linux: when the AppImage fails, latest.json lists Windows only, since it
# names only files that are really in the release.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.3.0 (the release tag is v<version>)
        required: true
        type: string
  # Not the Android app's tags (android-v*, android-release.yml); "v*" does
  # not match them anyway.
  push:
    tags: ['v*', '!android-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Stops the release before anything is built when updates cannot be
  # signed: without the key, Atlas could not check them.
  signing-key:
    name: Check the signing key for updates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the signing key for updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the repository secret TAURI_SIGNING_PRIVATE_KEY first (Settings, Secrets and variables, Actions). Without it the updates cannot be signed, and no release is made."
            exit 1
          fi
          echo "The signing key for updates is set."

  windows:
    name: Windows installer
    needs: signing-key
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$version\" is not a version like 0.3.0"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "asset=Atlas-$version-setup.exe"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the app version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$app_version" != "$VERSION" ]; then
            echo "::error::apps/desktop/package.json says $app_version, not $VERSION"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Lint, type checks and tests run on every pull request (ci.yml), so the
      # commit being released has passed them. They are not repeated here: on
      # Windows the checkout has CRLF line endings, which the format check
      # reports as style issues.
      # The plain viewer: the demo world only, no importers, no map image
      # downloads (ATLAS_ENABLE_DOWNLOADS stays off), the app's own name and
      # identifier. The installer is not code-signed for Windows; it is
      # signed for updates (ATLAS_UPDATER_ARTIFACTS=1: a .sig file beside
      # it, made with TAURI_SIGNING_PRIVATE_KEY).
      - name: Build the desktop app
        env:
          ATLAS_ENABLE_DOWNLOADS: '0'
          ATLAS_UPDATER_ARTIFACTS: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm desktop:build

      # The viewer must not be able to fetch map images: the download and map
      # page code is not compiled in, so the executable that the installer
      # holds names none of its commands (tiles_start and others) and has
      # none of its texts. Fails the release otherwise.
      - name: Check that the viewer holds no download code
        env:
          ATLAS_ENABLE_DOWNLOADS: '0'
        run: node apps/desktop/scripts/check-binary.js apps/desktop/src-tauri/target/release/atlas-desktop.exe

      - name: Start-up test of the app window
        env:
          ATLAS_ENABLE_DOWNLOADS: '0'
        run: pnpm --filter @atlas/desktop test:e2e:windows

      - name: Collect the installer and write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          shopt -s nullglob
          installers=(apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found ${#installers[@]}: ${installers[*]}"
            exit 1
          fi
          if [ ! -f "${installers[0]}.sig" ]; then
            echo "::error::The build wrote no signature (${installers[0]}.sig) for the installer"
            exit 1
          fi
          mkdir -p release
          cp "${installers[0]}" "release/$ASSET"
          # The signature is of the file's bytes, so it holds under the asset's name.
          cp "${installers[0]}.sig" "release/$ASSET.sig"
          ls -l release

          commit="$(git rev-parse --short HEAD)"
          # No backticks below: this heredoc expands variables.
          cat > release/notes.md <<EOF
          Atlas $VERSION for Windows and Linux: an offline map, checklist and guide viewer. It comes with a small demo world, and shows map packs from its maps folder and from any folder you choose (**Settings**, then **Games in other folders**).

          ## How to install

          1. Under **Assets** below, download **$ASSET**.
          2. Open the downloaded file. The installer is not signed, so Windows shows a blue "Windows protected your PC" box: press **More info**, then **Run anyway**.
          3. Follow the installer, then start **Atlas** from the Start menu.

          Map packs, with their map images, are kept in %LOCALAPPDATA%\\Atlas\\Maps unless you choose another folder. Your progress stays in the app.

          On Linux and the Steam Deck, download **Atlas.AppImage**, put it in the **Applications** folder of your home folder in place of the older one, and make sure **Is executable** is ticked under **Properties**, then **Permissions**.

          ## New in 0.29.0

          - **Magazines.** Magazines come in a pack of their own, one per magazine, written by the app that keeps them. **Magazines** beside the list of games opens a shelf of every magazine, then its issues, newest first, with covers. An issue opens in the guidebook reader, with **Games in this issue** in its contents.
          - **In magazines.** A game's guides list each issue that covers the game, with its pages. Press one to open the issue at the first of them. Search finds words on those pages too.
          - **Wiki pages look more like the wiki.** A row of small blocks keeps each block's lines, two short lists in a narrow box stay side by side, and lists in columns keep the wiki's number of entries per column. Pages read before show the new rows after **Build again from saved pages** in Atlas Importer.

          This version has passed the automatic checks only. No real magazine pack has been opened yet.

          ## New in 0.28.0

          - **Use a controller on the map.** The left stick moves the map, and the right stick moves it at a third of the speed for finer aim. RT zooms in and LT zooms out. A crosshair in the middle picks the nearest location: press A to open it, X to mark it found, and the D-pad to jump to the next location. Y opens the types and filters, R3 shows the whole map and L3 goes to the next level.
          - **Switch sections with the bumpers.** LB and RB go between Map, Guides, Lists, Progress and Games from any screen. In a guide, LT and RT turn the pages, and the right stick scrolls. Menu opens Settings and View opens the key guide.
          - **Button hints.** When you use a controller, a bar at the bottom shows what its buttons do on that screen. It hides again when you use the mouse, touch or keys.
          - **Keys and controller.** The key guide now has a Keyboard column and a Controller column. On the keyboard, W A S D move the map, + and - zoom, and Q and E switch sections.
          - **Settings, Controller.** Choose when the hints show, the button names (letters or shapes), how fast the map moves, and whether up and down are turned around. A line says whether a controller is detected.

          This version has passed the automatic checks only. It has not been tried with a controller on a real Windows PC or Steam Deck yet.

          ## New in 0.27.0

          - **Atlas updates itself.** A few seconds after it starts, Atlas looks for a newer version. When there is one, a notice shows what is new, with **Install now**, **Later** and **Skip this version**. **Install now** saves your changes, installs the update and starts Atlas again. **Settings** has an **Updates** group with **Check for updates**, and a switch to stop the look at the start.
          - **Where it does not.** The Linux AppImage updates itself too, but does not look when Steam starts it beside a game; **Check for updates** in Settings still works there. A copy installed another way on Linux is updated the way it was installed.
          - This is the last version you install by hand: from here on, updates come in by themselves.

          This version has passed the automatic checks only. Updating has not been tried on a real Windows PC or Steam Deck yet.

          ## New in 0.26.0

          - **Routes.** A route is a path on the map with a short guide at each step. Under **Lists**, **New route** makes one, or **Make a route from a list…** starts from an ordered list. Steps are locations or points of your own, and corner points let the line go around corners. On the map a route is a line through numbered steps, with **Previous** and **Next**; ticking a step marks its location found. A route can cross maps. Routes that a map pack carries show the same way.
          - **Wiki entries on the map.** In a wiki page, an entry that is on the map has a small map mark after it: press it to go to that location, or to choose among several. **Put entries on the map** lets you place an entry that is on no map yet, as a location of your own linked to the page.
          - **Add to a wiki page.** On a location's card, **Search wiki** is now **Add to a wiki page…**: it still finds the page about the location, and can also put a link to the location on a page of your own.
          - **Rename a map or a level.** **Rename…** beside each map and level, in the maps menu and in the game's **Maps and levels** card in the Library, gives it a name of your own. **Use the original name** gives the source's name back. Your names stay when the game is updated.
          - **A map's own icons.** A game read from a map site whose rules file allows it can show that site's own icons for its types, kept for your own use only. The game's **This map's icons** card in the Library has **Use this map's icons**; untick it to go back to Atlas's icons. A pack file carries these icons only when **Include this map's icons** is ticked.
          - **Exit Atlas.** While **Keep Atlas running when its window is closed** is on, **Exit Atlas** at the head of **Settings** ends Atlas, as **Quit Atlas** in the tray does.

          This version has passed the automatic checks only. None of this has been tried in a real Windows window yet.

          ## New in 0.25.0

          - **Guidebooks.** A guidebook is a published guide you have as one file, a PDF or a CBZ. In **Guides**, **Add a guidebook…** copies one into a pack file of its own in the packs folder, and it is listed with the game's other guides. It opens over the whole window: page by page or scrolling, zoom, **Fit width** and **Fit page**, a page to go to, the PDF's own **Contents**, **Back** after a jump, and **Find**. It opens again on the page you left. Its pages also show under **In guidebooks** in the search of Guides and of the map. **Remove this guidebook…** takes it out again; the file you added it from is never changed. Guidebooks that another app sends in a pack file show the same way.
          - **The packs folder can be changed.** **Settings**, then **Games in other folders**, has **Change packs folder…** and **Use the default folder**. Atlas asks whether to move the pack files there or leave them where they are. Atlas and Atlas Importer on one computer use the same packs folder, so update both together: an older version goes back to the default folder.

          This version has passed the automatic checks only. Guidebooks and moving the packs folder have not been tried in a real Windows window yet.

          ## New in 0.24.0

          Atlas can stay ready beside a game. Everything here is off until you turn it on, in **Settings**, then **Atlas in the background**.

          - **Keep Atlas running when its window is closed.** Closing the window hides it, and Atlas keeps running with its icon in the notification area. A press on the icon shows or hides the window. The icon's menu has **Quit Atlas**.
          - **Hotkey.** Ctrl+Alt+M is offered. Pressed in any program, a game too, it brings Atlas forward, and pressed again while Atlas is in front it puts Atlas away. **Change keys** takes the keys you press instead. Atlas says so when a combination cannot be used or another program has it, and keeps the old one.
          - **Back where you left it.** A hidden window comes back with the same game, map, location, zoom and panel. While any of these settings is on, Atlas also opens its window at the place and size you left it.
          - **Stay above other windows.** Atlas stays above other windows, such as a game in a borderless window. A game in exclusive full screen covers every window, so set the game to borderless or windowed.
          - **Start Atlas when Windows starts.** For your user only, and without coming to the front.
          - **Another program can ask for a game.** A program that starts Atlas can name the game to show, and can ask Atlas to get ready without coming to the front.

          This version has passed the automatic checks only. The icon, the hotkey over a game and the start with Windows have not been tried in a real Windows window yet.

          ## New in 0.23.0

          Maps, wikis and guides now come as pack files (.atlaspack), and Atlas reads each one as it is.

          - **Pack files are read where they lie.** Atlas no longer unpacks a pack file into a folder. It reads every pack file in the packs folder, %LOCALAPPDATA%\\Atlas\\Packs, and in the folders you added. **Add a pack file…** copies a file into the packs folder. You can also put files there yourself.
          - **Pack files that arrive.** A pack file that is put in the packs folder, or changed there, while Atlas is open is shown without a restart, with a notice. A file Atlas cannot open is listed with the reason.
          - **Open a pack file from Windows.** Windows now opens an .atlaspack file with Atlas. Only one Atlas runs at a time: a file opened while Atlas is open is shown in the window you have.
          - **Old folders.** A game kept as a folder by an older version is still shown, before a pack file of the same game. **Settings**, then **Old folders**, lists these folders with their sizes and removes them after asking. Nothing is listed on a computer that also has Atlas Importer.
          - **A map you make is a pack file too.** **New game…** is now **New map from a picture…**. A map you make is kept in a folder while you work on it. **Write the pack file…** writes it as one pack file with your own locations, lists and notes of it, checks the file, and then removes the folder. **Open for editing…** unpacks it again when you want to change it, and **Close without writing…** leaves the file as it was.
          - **The maker's locations.** A pack file of a map made in Atlas on another computer carries the maker's locations and lists. Atlas offers them with one button, **Add them to yours**, and never adds them by itself.
          - **Older versions.** Pack files from older versions still open. A pack file written by this version cannot be opened by an older Atlas, which says so.

          This version has passed the automatic checks only. No person has tried it in a real Windows window yet.

          ## New in 0.22.0

          Nothing changes in what you see in this release. The viewer keeps the same version number as the Importer, which gains a new map source.

          ## New in 0.21.0

          The list of your games is made for many games.

          - **Two views.** Above the list, **Cards** shows each game as before, and **Compact** shows one short row for each game.
          - **Tags.** A game's **More** menu has **Tags…**. Tags stand in groups: **System** and **Genre** are there from the start, and you can add groups of your own. A game can carry several tags.
          - **Group by.** Lists your games under headings: by **Source**, by **Contents** (Maps, Guides, Wiki pages), which the app fills in, or by the tags of one group. A heading shows its count and folds away.
          - **Find a game.** A box above the list finds a game by its name or a tag.
          - **Longer pictures in New game.** A map's picture may now be up to 65,535 pixels a side, within the same total of 268 million pixels, so long, thin maps are taken.

          Tags are kept by this app on this device. They are not in pack files or progress files.

          ## New in 0.20.1

          - **The contents beside a page fold away.** In **Guides**, the button at the top of the contents, or the key B, folds the contents away so the page takes the width. The button beside **Home** brings it back. Your choice is kept on this device for every game, and folding never loses your place in the page or in the contents.

          ## New in 0.20.0

          The bar beside a page in **Guides** now shows only the menu the source itself gives, and what you arrange by hand.

          - **The site's own menu only.** Atlas no longer files a page under another by reading pages: no tree made from links, and no levels made from the headings of a list page. The bar holds the game's own sections in their order, and the pages you put in a section or under a page yourself.
          - **A heading that is a page.** Where a heading of the bar is itself a page with pages under it, pressing the heading opens the page, and the page is not listed again under it.
          - **A page listed in several places.** A page the source's menu lists more than once is marked at each. The bar and the line above the page stay at the listing you pressed.
          - **Home.** A **Home** button is always in view above the page, and the key H goes there.
          - **All pages.** A row at the foot of the bar opens every page of the game from A to Z, with letters to jump by.
          - **No menu, no bar.** A game whose source gives no menu shows no bar. The page takes the width, with Home, search and **All pages** above it.
          - **The line above a page** shows the way you came. For a page outside the menu that you reach by search, it shows where the source itself files the page, when the game says so.
          - **Linked from.** Under a page, the pages that link to it.
          - **Not in the menu.** When you arrange the contents, the pages outside the menu are in a group of that name. Move one into a section or under a page to put it in the bar. **File the pages this page lists under it** still does so for a page you choose.

          A game or a file made with 0.20.0 still opens in older versions of Atlas, which file its pages as before.

          ## New in 0.19.1

          - **Fixed: a link to several locations of a map.** A guide's link that names more than one location of a map, or ends with a comma, stayed a web link. It now opens the first of its locations that your map has.

          ## New in 0.19.0

          You choose which guide or wiki to read at the top of **Guides**, a guide reads in order, and many screens say things more plainly.

          - **Choose what to read.** When a game has pages from more than one source, a switcher at the top of **Guides** lists each one with its site and the word Guide or Wiki. The contents, the landing page and the path line show the one you chose, and the app remembers it for each game. Links, search and **From the wiki** still reach every source: following a link to a page of another source switches to it, and a search result from another source says which one it is in.
          - **A guide reads in order.** Each page of a guide ends with **Previous** and **Next**, the keys [ and ] turn the pages, and the guide's first screen offers **Continue** at the page you read last. A game says whether its pages are a guide. For any game you can say so yourself: **Edit the pages**, then **These pages are read in order**.
          - **Pages beside sections.** The top of a game's contents can hold pages and sections in one order, so a guide's table of contents shows as its site orders it.
          - **Notices cover nothing.** A notice now stands at the top and moves the screen down a little while it shows, so it never lies over a button or a field.
          - **A new location of yours takes the type you used last.** The first time, the form asks you to choose a type. Before, it took the game's first type without asking.
          - **Clearer words.** Press in place of Tap and Click. The Lists section is headed **Lists**. **Hide found** on every size of screen. **Export to a file…**, **Import a pack file…** and **Import a list…** read the same everywhere. Every question offers the action by its name and **Cancel**; leaving a page with changes offers **Save**, **Discard changes** and **Cancel**.
          - **Smaller fixes.** **Edit locations** and the progress ring show on the Map only, so the map's name is no longer cut short. A problem with a photo shows under the button that caused it. On a phone the map's credit line is no longer under **Nearest unfound**. In Settings, **Games in other folders** names its two buttons for what they add.
          - **Fixed: pages of another game that stayed as they were.** When the pages of another game shown with this one were built again or replaced, Guides kept showing the earlier pages until the app was restarted.

          A game or a file made with 0.19.0 still opens in older versions of Atlas, which show loose pages at the top of the contents under a heading of their own.

          ## New in 0.18.0

          A picture that opens large or moves says so with a small mark, sources are told apart by their site, and a guide's link to a location of a map opens that location.

          - **Marks on pictures.** A picture on a page that opens in the larger view has a small mark in its bottom right corner, and a picture that moves has a play mark beside it. A picture that moves opens large when pressed, whatever its size, and plays there from its start. The photos on a location's card carry the same mark. Small pictures in a line of text and pictures that are links have none.
          - **Sources named by their site.** Where two sources of a title would share a name, each is named by the site its pages came from, in place of a number. The rows under **One title** show each game's site.
          - **Links to a location of a map.** A guide can say which of its links lead to a location of a map. Such a link opens the location on its map when you have that map, in the same game or in another game shown under the same title. A link that finds no location stays a web link.
          - **Web links are marked.** A link in a guide's text that opens in your browser has a small arrow beside it, so that it looks different from a link that stays in the app.

          A game or a file made with 0.18.0 still opens in older versions of Atlas, which show such links as web links.

          ## New in 0.17.0

          - **Lists of icons in columns.** A list flowed in columns whose every item is one line that begins with a small picture is shown without bullets, each picture beside its words, as a list of that sort set in a row already was.

          A game or a file made with 0.17.0 still opens in older versions of Atlas, which show such a list with its bullets.

          ## New in 0.16.0

          - **Page width.** A game's guide pages can be shown at three widths: **Reading**, a column of text about 760 pixels wide, as before; **Wide**, about 1,000 pixels, for pages laid out wider; and **Full**, as wide as the window. Choose it with the button at the top right of **Guides**. Your choice is kept with your own pages for that game and travels in a pack file exported with them. A pack can also say which width its pages were made for; that is the width you get until you choose another. A phone always shows a page as wide as the phone.

          A game or a file made with 0.16.0 still opens in older versions of Atlas, which show its pages at the reading width.

          ## New in 0.15.0

          A page can now be laid out as its site lays it out, a picture that moves is shown moving, and a location's photo opens at full size.

          - **Layout on a page.** A page's text can set blocks side by side with their shares of the width, frame a block as a card with a title, set short items in a row, flow a list in columns and centre a block. On a narrow window the blocks stand one under another in reading order. Pages made with a newer importer use these forms; pages you already have are unchanged.
          - **Layout in the page editor.** Each laid-out part shows as a frame around its blocks, with tools for its widths, blocks and columns, to move it and to take it apart. **Layout** in the text tools makes one around the part being edited.
          - **Pictures that move.** An animated GIF kept in a pack is shown moving. When your system asks for less motion it is shown still, with a **Play** button.
          - **Location photos at full size.** A photo kept at full size opens large when pressed; cards show a smaller copy made for them.

          A game or a file made with 0.15.0 still opens in older versions of Atlas, which show a laid-out page as one column with its marker lines as text.

          ## New in 0.14.0

          A game kept for your own use says so, exporting and importing speak for a wiki as well as a map, and a location's photo keeps its place.

          - **For personal use.** A game whose pages are kept under words you filled in, or under no licence, is marked **For personal use** in the Library. Exporting it is not held back: the export screen says that the file is for your own devices. Under each page, Guides shows the words the page is kept under, linked to the terms when there are any, or that no licence was recorded.
          - **Export and import for a wiki.** For a game of pages with no map, the export and import screens now speak of pages and pictures. There is no map detail to choose, and **Include downloaded pictures** comes first, because it decides whether the pages show their pictures on the other device. A game with a map says when a wiki shown with it under one title is not in its file: export the wiki by itself from the Library, under **More**, **Export to a file**.
          - **Pack files.** The file is now called a pack file everywhere, not a map pack file. Its ending, .atlaspack, and what it holds are unchanged, and files from older versions open as before.
          - **The photo box on a location's card.** When a card's details were long, the box with the location's photos shrank to a thin line. It now keeps its height and the details scroll.

          A game or a file made with 0.14.0 still opens in older versions of Atlas, which show the filled-in words as the page's licence.

          ## New in 0.12.0

          The contents of a wiki nests the way its index pages do, the line above a page shows the way you came, a picture opens large, and the contents can be arranged many pages at a time.

          - **Index pages with full tables.** An index page whose tables also name other pages in their later columns, such as where a thing is found or who sells it, was not taken for a list page, and everything it lists fell into "Pages". The links in the other cells of a row now count as part of that row, not against the page.
          - **Levels from the headings of an index page.** The pages an index page lists are no longer one long level under it. A heading that is a link to a page holds the pages listed under it, and a plain heading becomes a level of its own that opens the index page at that heading. A heading that lists nothing, or fewer than three pages, makes no level.
          - **The narrower list wins.** A page listed by a large index and by a narrower list under it goes under the narrower one.
          - **The way you came.** When you walk from page to page by links, tiles, "Also linked from" or "Pages under this page", the line above the page shows the pages you came through, with a dotted line under each. Press one to go back to it, as Back pressed that many times would. A page opened from the contents or from search shows where it sits in the contents, as before.
          - **A larger view of pictures.** Press a picture in a page, or a location's photo, to open it large. A picture larger than the window can be shown at its real size and moved around. Esc, the close button, a press beside the picture or Back closes it. A picture that is a link still follows its link, and a picture whose file is no larger than it is shown opens nothing.
          - **Arranging the contents, many pages at a time.** While editing a page, tick pages in the contents beside it and move them together, by dragging or with **Move to…**. **New level from these** makes a page of your own with the ticked pages under it, and can list them in its text. **New page under this page** makes a level in one press.
          - **Your say on list pages.** A page's menu in the contents has **File the pages this page lists under it**, for an index page Atlas did not recognise, **Do not file pages under this page**, for one it took wrongly, and **Let the app decide**.
          - **A list of the pages under a page.** In the page editor, **More text tools** can insert a list of links to the pages under the page you are editing. It is text from then on and does not change by itself.
          - **A page you put under a page no longer disturbs the others.** Only the page you moved is kept as your choice. The pages Atlas files there stay filed by Atlas, with their levels. A level made from a heading has **Make this a page of my own**, so you can rename it, move it and write in it.
          - **Smaller pictures in a map pack file.** When pictures go into an exported file, choose **Full size** or **Smaller**. Smaller makes each picture at most 1,280 pixels wide and saves photos as JPEG. The pictures on this computer and your own photos are never changed.

          Atlas works the contents out when Guides is opened, so the games you already have nest the new way at once. A game or a file made with 0.12.0 still opens in older versions of Atlas, which show the contents as before.

          ## New in 0.11.0

          The pages of a wiki are filed more carefully in its contents.

          - **Only a page that lists a page holds it.** Before, a page went under the first page that linked to it in any way, so the page of a weapon could hold the locations and characters its text names. Now a page goes only under a list page: an index such as Weapons, where the link is the main link of a list item, of a tile, of a line of links, of a heading, or of the name column of a table. A link in a sentence, in a box of facts or in another column of a table only mentions a page and files nothing.
          - **Pages named everywhere.** A page that many pages link to, such as a main location or a main character, goes only under a page that really lists it, never under one of the many pages that name it.
          - **Where the source files a page.** A game can now say which page each page belongs under, and Atlas uses that before anything else.
          - **When unsure, flat.** A page no list page lists stays in its section under its own name. No page is left out of the contents, and a page reached from several pages still names the others under **Also linked from**.
          - **Your own choices win.** A page you put somewhere with **Move to** stays there.

          Atlas works the tree out when Guides is opened, so the games you already have are filed the new way at once. A game made with 0.11.0 still opens in older versions of Atlas, which show the tree as before.

          ## New in 0.10.0

          A wiki opens on a landing page, a page's box of facts stays a box, and links lead to parts of pages.

          - **Landing page.** Guides now opens on a landing page, and the game's name stands at the top of the contents and at the start of the path line, where "Contents" stood: press it to come back. When the wiki's own home page was read, the landing page is that page. For any other game Atlas makes one from the contents: each section with its pages as tiles, with a picture where a page has one.
          - **Boxes of facts.** The box at the side of a wiki page (a title, a picture, a caption, rows of a label and its value) is now one box beside the text, and across the page on a phone, where it was a run of headings before. Its labels are no longer headings of the page. In the page editor's Markdown view it is a table of two columns whose first row is the title and {box}.
          - **Tiles.** A list of pictures that each have a name, as a wiki's home page or gallery has, is shown as a grid of tiles.
          - **On this page.** A guide page with three headings or more lists them at its head, each sub-heading set in under its heading. Press one to go to that part of the page; **Back** returns to where you were reading. The list is open in a wide window and folded on a phone: press **On this page** to fold or unfold it. It works with the keyboard, and on your own pages too.
          - **Links to a part of a page.** A link can now lead to a heading of a page, not only to its top. Atlas opens the page at that heading, or moves there when it is the page you are reading, and **Back** returns. Every heading has a name made from its words: "By boat" is by-boat. In the page editor's Markdown view, write it after the address: \\[by boat\\](demo:guide:wiki-travel "#by-boat"). When no heading fits, the page opens at its top.
          - Notices and quotes of a wiki page are shown as quotes, a table keeps its caption, and merged cells no longer push a table's columns out of line.

          A game made with 0.10.0 still opens in older versions of Atlas: they show a box of facts as a table, tiles as a list, and open a link to a part of a page at its top. The one exception is a map whose image server counts rows from the bottom, which needs 0.10.0. The Classic layout has no landing page.

          ## New in 0.9.0

          - **Add to build.** Collect what you want for a build while you read. A guide page has **Add to build** at its head, a table row that names something has a small + button at the end of its first cell, each result of a search in Guides has one, and so does a location's card. The first time, Atlas asks which Build guide to add to, or starts a new one; after that, everything goes to the same list with one press, until you choose **Change**. A notice says what was added, with **Undo**, and a thing that is in the list already is not added twice. Each thing is a step: its name, a link to its page, and the location when you added it from a card.
          - **Find on the map.** A Build guide has **Find on the map**, for the steps that have no location yet. Atlas looks in the links of their pages to the map, at the location names that fit the step's name, and in the page itself (a "Where to find" part, a Location column, a box of facts). It then shows what it found in three groups: found, several possible (nearest first, each with its type and region and a **Show** button for the map), and not found. Nothing changes until you press **Put on the steps**, and that can be undone. Only saved pages are read; nothing is fetched.
          - **Suggest an order** puts a Build guide's steps nearest next and draws the route on the map. It goes by straight lines, so it knows nothing of locked doors, story order, merchants or random drops.

          Find on the map and Suggest an order need a window of a tablet's width or more. A list made this way is an ordinary list of your own, and opens in older versions of Atlas. Materials are not counted: add what you need as steps.

          ## New in 0.8.0

          - **One title for several sources.** When you have the same game from more than one place, such as two maps of it from different sources and a wiki, you can show them under one title. On a game in **Games**, choose **Show with another game under one title**, pick the other game and keep the title or type another. The title is one row that says **Sources: A, B**, and opening it opens the source you used last. The maps menu lists the maps of every source under its name, so you change source where you change map. A wiki under the title shows its pages in **Guides** with every source, and **Search wiki** on a location's card searches them.
          - **Nothing is merged.** Each source keeps its own found marks, lists, locations, notes and progress. **Show separately again** undoes the title, and **Take out** removes one source from it; nothing is lost either way.

          A map pack file carries the title when you tick **Include my lists, locations, types and photos**; such a file needs Atlas 0.8.0 to open.

          ## New in 0.7.0

          - **My notes.** Every location's card has **Add a note**, on the locations that came with the game as well as your own. Write what you want to remember in plain text or Markdown, with photos. A location with a note has a small mark on the map, **With my notes** in the filters shows only those, and search finds the words of your notes after the names. Your notes are kept in a file of their own beside the game, so updating the game never changes them. If an update takes a location away, its note is kept under **Notes without a location**, where you can copy or delete it. Notes travel in a map pack file when you tick **Include my lists, locations, types and photos**.
          - **Search wiki.** A location's card can search the game's saved wiki pages for the location's name, the best first. Spelling, the order of the words, punctuation, plurals, a number at the end and words written together or apart do not have to match, and other names of a page count too. **Read** opens a page, and **This is the page** links it, for every location of that name or only this one. From then on the card shows the page under **From the wiki**. **Not this page** takes the link off, and **Search for another page** looks again. Only saved pages are searched; nothing is fetched.

          A map pack file that carries notes, or a page linked to one location alone, needs Atlas 0.7.0 to open. An older Atlas uses links made in 0.7.0 without changing them.

          ## New in 0.6.3

          - **Pages under pages.** In Guides, a page that the game's contents does not place is now shown under the page that leads to it, by the fewest links from the contents, instead of in one long list under **Pages**. The contents at the side is a tree: it opens to the page you are reading and shows the pages beside it. **Pages** keeps only the pages that nothing in the contents leads to.
          - **The whole way to a page.** The line above a page names every step down to it, such as Contents › Equipment › Armor › Warden Plate, and each step is a link, so you can go up as well as down.
          - **Also linked from.** A page that several pages link to has one home in the contents. The other pages that link to it are listed on it under **Also linked from**.
          - **Put a page under a page.** When you edit the contents, **Move to…** can put a page under another page as well as in a section. A page you put somewhere stays there.
          - **A page with two names.** A link that uses another name of a page now opens the page.

          The tree is worked out from the links between a game's pages, so it needs a map pack written by Atlas 0.6.3 or later; an older pack shows its pages as before.

          ## New in 0.6.2

          - **Sort a table.** In Guides, press a column heading of a table to sort by it: once for smallest first, again for largest first, a third time for the page's own order. Numbers sort as numbers. It changes only what you see, never the page.
          - **Raised and lowered text.** A guide page can hold raised and lowered text, such as a note's mark or a small tag after a name. In Markdown: ^raised^ and \~lowered\~.
          - **Coloured words.** A guide page can hold coloured words, shown lighter or darker where needed so they can be read in both the light and the dark theme. In Markdown: [words]{color=#b8714a}.
          - **Line breaks in table cells.** A table cell can hold several lines. In the page editor, Shift+Enter in a cell starts a new line; in Markdown it is written &lt;br&gt;.
          - **Hidden tables and lists.** Hidden text can now hold a whole table or list, shown with **Show hidden text**.
          - The page editor keeps all of these when you edit a page.

          A map pack whose guide pages use the new marks needs Atlas 0.6.2 or later; an older app shows the marks as they are written.

          ## New in 0.6.1

          - **A caption no longer stretches a picture.** In Guides, a picture with a long line of words under it was stretched to the width of that line; it keeps its own size now.
          - **Links to pages not there yet.** On a guide page of a game read from a site, a link to a page the game does not hold yet has a dotted underline and says "This page has not been read yet". It becomes a working link when the game gets that page.

          ## New in 0.6.0

          - **The Library.** The games on this computer now have a screen of their own, **Library**, the first section in the strip at the side. Pick a game on the left to see what it holds, with **Show the map** or **Read the guides** at the top. **More** holds what is used less often (export to a file, import a map pack file, open its folder, delete), each with a sentence on what it does. **New game…** is under the list of games. In the Classic layout the folder icon opens the same screen.
          - **Settings.** A new **Settings** section holds the theme, the layout, where maps are saved and the map packs shown from other folders.
          - **Edit guide pages.** In **Guides**, **Edit the page** opens a page editor. Edit a page as it looks (**Formatted**), with headings, lists, tables, pictures, links to locations and other pages, and text hidden until tapped, or as text (**Markdown**), which covers everything a page can hold. Add pages and sections of your own, hide pages, and arrange the contents. The game's own pages are never changed: your version is kept beside the game, and **Go back to the wiki's version** undoes it. When a page you changed is changed in the game later, your version stays and Atlas says so.
          - **Small pictures in the line of text.** A picture a page gives a small size (an icon or a badge) now stands in the line of text at that size, with no caption.
          - **Export.** The tick box for your own content now covers the pages you changed or wrote. A file that carries them needs Atlas 0.6.0 or later to import.

          ## New since 0.4.4

          - **Lists and guides of your own.** Under **Lists**, **New list or guide** starts one from a template: Collection, Secrets guide, Photo guide, 100% route, Build guide or Plain list. Add locations from the map, a whole type in an area, by search or from another list. Notes take bold, bullets, links to locations and guides, and text that stays hidden until tapped. Drag steps to reorder them, or use **Suggest an order**. A list exports as one file (.atlaslist). The game's own lists are never changed.
          - **Games of your own.** **Games**, then **New game…**: give it a name and one large picture (PNG, JPEG or WebP, up to 16,384 × 16,384 pixels), and Atlas cuts it into a map. More maps and levels can be added later.
          - **Edit locations.** Put your own locations, types and areas on any map, your own or an imported one. The game's own locations stay as they are.
          - **Photos.** A location and a list entry can show photos, and a Photo guide shows each entry as a card with its photo. Add your own screenshots with **Add a photo**. A photo marked as a spoiler stays blurred until tapped.
          - **Guides.** A new **Guides** section reads guides as pages, with a contents, tables, pictures, links between pages and search. A game can hold guides and no map.
          - **Pages linked to the map.** In Guides, **Link pages to the map** compares page names with the map's locations, types and regions. Nothing is linked until you confirm it. A linked page then shows on its locations' cards.
          - **Export.** A map pack file (.atlaspack) can carry your own lists, locations, types and photos: tick **Include my lists, locations, types and photos**.
          - The menus now say **location** and **type**.

          Your own lists, locations and photos are kept beside each game in the maps folder, never inside it, so updating a map does not undo them. Lists, locations and photos are made in a window of a tablet's width or more.

          ---

          Built from commit $commit.
          EOF
          cat release/notes.md

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.asset }}
          path: release/${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

      # For latest.json: the installer's signature and the notes.
      - name: Upload the signature and notes as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-update
          path: |
            release/${{ steps.version.outputs.asset }}.sig
            release/notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          # A normal release (not a draft, not a prerelease), marked as the
          # repository's latest, so /releases/latest/download/latest.json
          # leads to it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: replacing its installer, signature and notes."
            gh release upload "$TAG" "release/$ASSET" "release/$ASSET.sig" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/notes.md
          else
            gh release create "$TAG" "release/$ASSET" "release/$ASSET.sig" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Atlas $VERSION" \
              --notes-file release/notes.md \
              --latest
          fi

  # The AppImage for Linux and the Steam Deck, built, checked and started
  # once as linux-release.yml does, and signed for updates. It does not hold
  # up the Windows release; the next job attaches it.
  linux:
    name: Linux AppImage
    needs: signing-key
    uses: ./.github/workflows/linux-appimage.yml
    permissions:
      contents: read
    with:
      require-signing: true
    secrets: inherit

  # Attaches the AppImage and its signature to the release when they were
  # built, then writes latest.json from the files that are really in the
  # release: Windows always, Linux when it was attached.
  updates:
    name: Linux AppImage and latest.json
    needs: [windows, linux]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Reading this run's artifacts.
      actions: read
    steps:
      - name: Download the installer's signature and the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-update --dir windows
          ls -l windows

      - name: Attach the AppImage to the release
        id: linux
        if: ${{ needs.linux.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.windows.outputs.tag }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Atlas.AppImage --dir linux
          ls -l linux
          if [ ! -s linux/Atlas.AppImage ] || [ ! -s linux/Atlas.AppImage.sig ]; then
            echo "::error::The AppImage or its signature is missing"
            exit 1
          fi
          # Always Atlas.AppImage, so the Steam launch line keeps naming it
          # after an update replaced it in place.
          gh release upload "$TAG" linux/Atlas.AppImage linux/Atlas.AppImage.sig \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "attached=true" >> "$GITHUB_OUTPUT"

      - name: Say that Linux is left out
        if: ${{ steps.linux.outputs.attached != 'true' }}
        run: echo "::warning::The Linux AppImage was not built or not attached, so latest.json offers the update on Windows only."

      # The version, what is new (the notes' "New in <version>" part), when
      # it was published, and for each system the file's address and its
      # signature, as the updater reads them.
      - name: Write latest.json
        env:
          VERSION: ${{ needs.windows.outputs.version }}
          TAG: ${{ needs.windows.outputs.tag }}
          ASSET: ${{ needs.windows.outputs.asset }}
          LINUX: ${{ steps.linux.outputs.attached == 'true' }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          notes="$(awk -v head="## New in $VERSION" '
            $0 == head { on = 1; next }
            on && (/^## / || /^---/) { exit }
            on { print }
          ' windows/notes.md | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}')"
          if [ -z "$notes" ]; then
            echo "::warning::The notes have no \"## New in $VERSION\" part, so the update says only its version."
            notes="Atlas $VERSION."
          fi
          platforms="$(jq -n \
            --arg url "$base/$ASSET" \
            --rawfile signature "windows/$ASSET.sig" \
            '{ "windows-x86_64": { url: $url, signature: $signature } }')"
          if [ "$LINUX" = true ]; then
            platforms="$(jq -n \
              --argjson platforms "$platforms" \
              --arg url "$base/Atlas.AppImage" \
              --rawfile signature linux/Atlas.AppImage.sig \
              '$platforms + { "linux-x86_64": { url: $url, signature: $signature } }')"
          fi
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > latest.json
          cat latest.json

      - name: Attach latest.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.windows.outputs.tag }}
        run: |
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)"
          if [ "$latest" = "$TAG" ]; then
            echo "$TAG is the repository's latest release: Atlas finds this update."
          else
            echo "::warning::The repository's latest release is $latest, not $TAG, so Atlas does not offer this version as an update."
          fi
