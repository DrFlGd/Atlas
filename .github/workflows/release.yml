# Builds the plain Atlas viewer for Windows (with the demo world, no
# importers and no map image downloads) and publishes the installer as a
# GitHub Release of this repository.
#
# Run it from the Actions tab ("Release", "Run workflow") with a version such
# as 0.3.0, or push a tag such as v0.3.0. The version must match the one in
# apps/desktop/package.json, so the installer and the app say the same.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.3.0 (the release tag is v<version>)
        required: true
        type: string
  # Not the Android app's tags (android-v*, android-release.yml); "v*" does
  # not match them anyway.
  push:
    tags: ['v*', '!android-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$version\" is not a version like 0.3.0"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "asset=Atlas-$version-setup.exe"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the app version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$app_version" != "$VERSION" ]; then
            echo "::error::apps/desktop/package.json says $app_version, not $VERSION"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Lint, type checks and tests run on every pull request (ci.yml), so the
      # commit being released has passed them. They are not repeated here: on
      # Windows the checkout has CRLF line endings, which the format check
      # reports as style issues.
      # The plain viewer: the demo world only, no importers, no map image
      # downloads (ATLAS_ENABLE_DOWNLOADS stays off), the app's own name and
      # identifier. No signing keys are set: the installer is unsigned.
      - name: Build the desktop app
        env:
          ATLAS_ENABLE_DOWNLOADS: '0'
        run: pnpm desktop:build

      # The viewer must not be able to fetch map images: the download and map
      # page code is not compiled in, so the executable that the installer
      # holds names none of its commands (tiles_start and others) and has
      # none of its texts. Fails the release otherwise.
      - name: Check that the viewer holds no download code
        env:
          ATLAS_ENABLE_DOWNLOADS: '0'
        run: node apps/desktop/scripts/check-binary.js apps/desktop/src-tauri/target/release/atlas-desktop.exe

      - name: Start-up test of the app window
        env:
          ATLAS_ENABLE_DOWNLOADS: '0'
        run: pnpm --filter @atlas/desktop test:e2e:windows

      - name: Collect the installer and write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          shopt -s nullglob
          installers=(apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found ${#installers[@]}: ${installers[*]}"
            exit 1
          fi
          mkdir -p release
          cp "${installers[0]}" "release/$ASSET"
          ls -l release

          commit="$(git rev-parse --short HEAD)"
          # No backticks below: this heredoc expands variables.
          cat > release/notes.md <<EOF
          Atlas $VERSION for Windows: an offline map, checklist and guide viewer. It comes with a small demo world, and shows map packs from its maps folder and from any folder you choose (**Settings**, then **Map packs elsewhere**).

          ## How to install

          1. Under **Assets** below, download **$ASSET**.
          2. Open the downloaded file. The installer is not signed, so Windows shows a blue "Windows protected your PC" box: click **More info**, then **Run anyway**.
          3. Follow the installer, then start **Atlas** from the Start menu.

          Map packs, with their map images, are kept in %LOCALAPPDATA%\\Atlas\\Maps unless you choose another folder. Your progress stays in the app.

          ## New in 0.6.3

          - **Pages under pages.** In Guides, a page that the game's contents does not place is now shown under the page that leads to it, by the fewest links from the contents, instead of in one long list under **Pages**. The contents at the side is a tree: it opens to the page you are reading and shows the pages beside it. **Pages** keeps only the pages that nothing in the contents leads to.
          - **The whole way to a page.** The line above a page names every step down to it, such as Contents › Equipment › Armor › Warden Plate, and each step is a link, so you can go up as well as down.
          - **Also linked from.** A page that several pages link to has one home in the contents. The other pages that link to it are listed on it under **Also linked from**.
          - **Put a page under a page.** When you edit the contents, **Move to…** can put a page under another page as well as in a section. A page you put somewhere stays there.
          - **A page with two names.** A link that uses another name of a page now opens the page.

          The tree is worked out from the links between a game's pages, so it needs a map pack written by Atlas 0.6.3 or later; an older pack shows its pages as before.

          ## New in 0.6.2

          - **Sort a table.** In Guides, press a column heading of a table to sort by it: once for smallest first, again for largest first, a third time for the page's own order. Numbers sort as numbers. It changes only what you see, never the page.
          - **Raised and lowered text.** A guide page can hold raised and lowered text, such as a note's mark or a small tag after a name. In Markdown: ^raised^ and \~lowered\~.
          - **Coloured words.** A guide page can hold coloured words, shown lighter or darker where needed so they can be read in both the light and the dark theme. In Markdown: [words]{color=#b8714a}.
          - **Line breaks in table cells.** A table cell can hold several lines. In the page editor, Shift+Enter in a cell starts a new line; in Markdown it is written &lt;br&gt;.
          - **Hidden tables and lists.** Hidden text can now hold a whole table or list, shown with **Show hidden text**.
          - The page editor keeps all of these when you edit a page.

          A map pack whose guide pages use the new marks needs Atlas 0.6.2 or later; an older app shows the marks as they are written.

          ## New in 0.6.1

          - **A caption no longer stretches a picture.** In Guides, a picture with a long line of words under it was stretched to the width of that line; it keeps its own size now.
          - **Links to pages not there yet.** On a guide page of a game read from a site, a link to a page the game does not hold yet has a dotted underline and says "This page has not been read yet". It becomes a working link when the game gets that page.

          ## New in 0.6.0

          - **The Library.** The games on this computer now have a screen of their own, **Library**, the first section in the strip at the side. Pick a game on the left to see what it holds, with **Show the map** or **Read the guides** at the top. **More** holds what is used less often (export to a file, import a map pack file, open its folder, delete), each with a sentence on what it does. **New game…** is under the list of games. In the Classic layout the folder icon opens the same screen.
          - **Settings.** A new **Settings** section holds the theme, the layout, where maps are saved and the map packs shown from other folders.
          - **Edit guide pages.** In **Guides**, **Edit the page** opens a page editor. Edit a page as it looks (**Formatted**), with headings, lists, tables, pictures, links to locations and other pages, and text hidden until tapped, or as text (**Markdown**), which covers everything a page can hold. Add pages and sections of your own, hide pages, and arrange the contents. The game's own pages are never changed: your version is kept beside the game, and **Go back to the wiki's version** undoes it. When a page you changed is changed in the game later, your version stays and Atlas says so.
          - **Small pictures in the line of text.** A picture a page gives a small size (an icon or a badge) now stands in the line of text at that size, with no caption.
          - **Export.** The tick box for your own content now covers the pages you changed or wrote. A file that carries them needs Atlas 0.6.0 or later to import.

          ## New since 0.4.4

          - **Lists and guides of your own.** Under **Lists**, **New list or guide** starts one from a template: Collection, Secrets guide, Photo guide, 100% route, Build guide or Plain list. Add locations from the map, a whole type in an area, by search or from another list. Notes take bold, bullets, links to locations and guides, and text that stays hidden until tapped. Drag steps to reorder them, or use **Suggest an order**. A list exports as one file (.atlaslist). The game's own lists are never changed.
          - **Games of your own.** **Games**, then **New game…**: give it a name and one large picture (PNG, JPEG or WebP, up to 16,384 × 16,384 pixels), and Atlas cuts it into a map. More maps and levels can be added later.
          - **Edit locations.** Put your own locations, types and areas on any map, your own or an imported one. The game's own locations stay as they are.
          - **Photos.** A location and a list entry can show photos, and a Photo guide shows each entry as a card with its photo. Add your own screenshots with **Add a photo**. A photo marked as a spoiler stays blurred until tapped.
          - **Guides.** A new **Guides** section reads guides as pages, with a contents, tables, pictures, links between pages and search. A game can hold guides and no map.
          - **Pages linked to the map.** In Guides, **Link pages to the map** compares page names with the map's locations, types and regions. Nothing is linked until you confirm it. A linked page then shows on its locations' cards.
          - **Export.** A map pack file (.atlaspack) can carry your own lists, locations, types and photos: tick **Include my lists, locations, types and photos**.
          - The menus now say **location** and **type**.

          Your own lists, locations and photos are kept beside each game in the maps folder, never inside it, so updating a map does not undo them. Lists, locations and photos are made in a window of a tablet's width or more.

          ---

          Built from commit $commit.
          EOF
          cat release/notes.md

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.asset }}
          path: release/${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists: replacing its installer and notes."
            gh release upload "$TAG" "release/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release/notes.md
          else
            gh release create "$TAG" "release/$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Atlas $VERSION" \
              --notes-file release/notes.md
          fi
