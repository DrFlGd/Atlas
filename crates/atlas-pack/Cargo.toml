[package]
name = "atlas-pack"
version = "0.1.0"
description = "Reads the description and small pictures of an Atlas pack file (.atlaspack) without unpacking it, and writes a pack file of guidebooks or of magazines"
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false

# What another app needs to read a pack file without unpacking it: the
# description's types and checks, and its small pictures. No Tauri, no app
# code and no network code; see docs/pack-file-format.md in this repository.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ZIP with stored and deflated entries only, as the Atlas app reads them.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Unpacks the object streams of a PDF to count its pages (see src/pdf.rs).
# Already in the tree through zip, with the same back end.
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
