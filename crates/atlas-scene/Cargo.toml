[package]
name = "atlas-scene"
version = "0.2.0"
description = "Builds the 3D model of an Atlas map from a raw glTF model or a model file (glTF, OBJ, STL, PLY): lines it up with the game's world, drops what is never seen, cuts it into square cells with levels of detail, compresses it, draws it from above and checks the result"
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false

# One builder for every 3D map, so they all come out the same: the Map Maker
# runs it as a program (`atlas-scene build <job.json>`), and another Rust app
# (such as a Tauri shell) can call `atlas_scene::build` directly. See
# "Building a 3D map" in docs/pack-file-format.md.

[lib]
name = "atlas_scene"
path = "src/lib.rs"

[[bin]]
name = "atlas-scene"
path = "src/main.rs"

[dependencies]
# The scene file name rule, shared with the pack file reader.
atlas-pack = { path = "../atlas-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# meshoptimizer 1.3 (bundled C++ source, built with the system's C++
# compiler: MSVC on Windows): simplification, vertex cache and fetch order,
# and the EXT_meshopt_compression encoders. MIT OR Apache-2.0.
meshopt = "=0.7.0"
# PNG map image tiles, in pure Rust. MIT OR Apache-2.0.
png = "=0.18.1"
# Reading a model's JPEG textures for their average colour (`textures`),
# in pure Rust. MIT OR Apache-2.0 OR Zlib.
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
# Keeping a model's textures (`textures`, mode `keep`): resizing them and
# writing them again as PNG or JPEG, in pure Rust (the same crate and
# version the desktop shell has already). MIT OR Apache-2.0.
# Also TGA and BMP, which OBJ models often use for their textures (turned
# into PNG once, `formats`).
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "tga"] }
# Reading Wavefront OBJ models with their materials (`formats`), in pure
# Rust, without its default hashing crate. MIT.
tobj = { version = "=4.0.5", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
