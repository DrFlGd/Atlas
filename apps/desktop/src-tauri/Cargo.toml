[package]
name = "atlas-desktop"
version = "0.8.0"
description = "Atlas desktop shell"
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary, which
# avoids a Cargo name clash on Windows. The desktop binary links the rlib;
# the Android app loads the cdylib (`libatlas_desktop_lib.so`).
name = "atlas_desktop_lib"
crate-type = ["cdylib", "rlib"]

[features]
# "Download map images" and "View map page and save images as I browse":
# fetching map images from other servers. Off in the public viewer; a build
# turns it on with ATLAS_ENABLE_DOWNLOADS=1 (see README, "Building another
# app from the shell"), which passes `--features downloads` to tauri build.
default = []
downloads = ["dep:reqwest", "dep:rustls", "dep:image", "dep:httpdate"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.45", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
# Unpacking the game's map files from its bundles (game files, read-only):
# zlib (MIT/Apache-2.0), Snappy (BSD-3-Clause) and LZ4 blocks (MIT).
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
snap = "1.1.1"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "safe-encode", "checked-decode"] }
# Map pack files (`.atlaspack`, see src/packfile.rs): ZIP with deflate only,
# through the flate2 already in the build. No encryption, no other methods.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Map image downloads (the `downloads` feature only). rustls with the ring
# provider and the system's certificate store; no cookies, no compression
# negotiation.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
httpdate = { version = "1.0.3", optional = true }

# Android: map pack files and progress files picked or saved with the
# system's dialogs are `content://` addresses, opened through this plugin
# (already in the build for the dialog plugin). Used from Rust only.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2.7.1"

# Free disk space before a map pack file is unpacked (src/packfile/space.rs).
# A map from one picture ("New game", src/tiles/cut.rs): decoding PNG, JPEG
# and WebP pictures and encoding map tiles, in every desktop build (with
# downloads too, which uses the same crate). The PNG decoder is used
# directly to read a large picture a band of rows at a time. Not on Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1.45", features = ["io-util", "net"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
