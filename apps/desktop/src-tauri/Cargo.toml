[package]
name = "atlas-desktop"
version = "0.35.3"
description = "Atlas desktop shell"
edition = "2021"
license = "MIT"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary, which
# avoids a Cargo name clash on Windows. The desktop binary links the rlib;
# the Android app loads the cdylib (`libatlas_desktop_lib.so`).
name = "atlas_desktop_lib"
crate-type = ["cdylib", "rlib"]

[features]
# "Download map images" and "View map page and save images as I browse":
# fetching map images from other servers. Off in the public viewer; a build
# turns it on with ATLAS_ENABLE_DOWNLOADS=1 (see README, "Building another
# app from the shell"), which passes `--features downloads` to tauri build.
default = []
downloads = ["dep:reqwest", "dep:rustls", "dep:image", "dep:httpdate", "dep:resvg", "dep:atlas-scene"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.45", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
# Unpacking the game's map files from its bundles (game files, read-only):
# zlib (MIT/Apache-2.0), Snappy (BSD-3-Clause) and LZ4 blocks (MIT).
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
snap = "1.1.1"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "safe-encode", "checked-decode"] }
# Pack files (`.atlaspack`, see src/packfile.rs): ZIP with deflate only,
# through the flate2 already in the build. No encryption, no other methods.
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# What a pack file's description is and how it is read, shared with other
# apps that show pack files without unpacking them (MIT, in this repository).
atlas-pack = { path = "../../../crates/atlas-pack" }
# Map image downloads (the `downloads` feature only). rustls with the ring
# provider and the system's certificate store; no cookies, no compression
# negotiation.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }
httpdate = { version = "1.0.3", optional = true }
# Pictures of guide pages that are SVG drawings (the `downloads` feature
# only): drawn once to a PNG, JPEG or WebP picture when they are downloaded,
# so every app shows them as it shows any picture (MIT/Apache-2.0). Text is
# drawn with the computer's fonts; pictures inside a drawing are not read.
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts"], optional = true }

# Android: pack files and progress files picked or saved with the
# system's dialogs are `content://` addresses, opened through this plugin
# (already in the build for the dialog plugin). Used from Rust only.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2.7.1"

# Free disk space before a pack file is unpacked (src/packfile/space.rs).
# A map from one picture ("New game", src/tiles/cut.rs): decoding PNG, JPEG
# and WebP pictures and encoding map tiles, in every desktop build (with
# downloads too, which uses the same crate). The PNG decoder is used
# directly to read a large picture a band of rows at a time. Not on Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.18.1"
# 3D models of maps an importer reads (src/scenebuilds.rs, the `downloads`
# feature only): Atlas's one 3D builder, so a map read from a site comes
# out as one the Map Maker makes (MIT, in this repository). Not on Android,
# which builds no models.
atlas-scene = { path = "../../../crates/atlas-scene", optional = true }
# One Atlas at a time: a second start (a pack file opened from the file
# manager) hands its arguments to the one running and ends (Apache-2.0 OR
# MIT, the Tauri 2 plugin).
tauri-plugin-single-instance = "2.5.5"
# Noticing pack files that arrive, change or go in the folders Atlas reads
# (src/receive/watch.rs), with a look that needs no events as well (CC0-1.0).
notify = "8.2.2"
# Atlas in the background (src/background/, the app without downloads, on
# Windows): the icon in the notification area, through Tauri's own tray
# (Apache-2.0 OR MIT, the same crate as above with one more feature).
tauri = { version = "2.12.5", features = ["tray-icon"] }
# The hotkey that brings Atlas forward, registered with the system only
# while it is switched on (Apache-2.0 OR MIT, the Tauri 2 plugin). Used from
# Rust only: no capability grants the web app any of its commands.
tauri-plugin-global-shortcut = "2.4.1"
# "Start Atlas when Windows starts": the entry in the current user's list of
# programs started with Windows (MIT). The crate the Tauri 2 autostart
# plugin is made of, used directly: the plugin writes the list of every user
# when Atlas runs as administrator and leaves the program's path without
# quotes, and it has no setting for either.
auto-launch = "0.6.0"
# Atlas in Steam (src/steam/): Steam's id of a non-Steam shortcut is a
# CRC32 of its program and name (MIT OR Apache-2.0, already in the build
# through flate2).
crc32fast = "1.5.0"

# Updating the viewer itself (src/updates/), on Windows and Linux: reads
# latest.json of the repository's newest release, checks the download's
# signature against the public key in tauri.conf.json, and installs it (the
# NSIS installer on Windows, the AppImage in place on Linux). Used from Rust
# only, and only the app without downloads registers it (`cfg(self_update)`,
# set by build.rs). Apache-2.0 OR MIT, the Tauri 2 plugin, with rustls and
# the system's proxy, and without its zip support, which updates of other
# bundles use.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1.45", features = ["io-util", "net"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
