[project]
name = "atlas-gamefiles"
version = "0.2.0"
description = "Atlas Map Maker helper: reads a player's own game files, reports what map data they hold, and makes Atlas map packs from them."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# Exact versions, with every transitive dependency, are in requirements.txt.
dependencies = [
  "soulstruct==2.6.0",
  "soulstruct-havok==1.5.0",
  "colorama==0.4.6",
  "numpy",
  "scipy",
  "Pillow==12.3.0",
]

[project.scripts]
atlas-gamefiles = "atlas_gamefiles.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas_gamefiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
